services:

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVERNAME: backend
    ports:
      - "3003:3003"

  backend2:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVERNAME: backend2
    ports:
      - "3004:3003"

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
