name: deploy to ec2
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name:checkout code
        uses: actions/checkout@v6     

      - name: deploy to ssh
        uses: appleboy/ssh-action@v1 
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            cd /home/ubuntu/GENAI
            git pull origin main